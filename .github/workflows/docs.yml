name: Documentation

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

# Pages permits only one deployment at a time. Keep deploy jobs serialized so
# overlapping pushes do not leave a deployment waiting until deploy-pages times out.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312-glpk.txt -e ".[docs,dev]"

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Run offline documentation examples
        run: pytest tests/docs

  deploy:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312-glpk.txt -e ".[docs]"

      - name: Build documentation strictly
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages can remain queued temporarily during service-side rollout.
          timeout: 1800000
