name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraints: constraints/py310-glpk.txt
          - python-version: "3.11"
            constraints: constraints/py311-glpk.txt
          - python-version: "3.12"
            constraints: constraints/py312-glpk.txt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -c "${{ matrix.constraints }}" -e ".[dev]"

      - name: Lint package and tests
        run: ruff check src tests

      - name: Run default offline tests
        run: >-
          pytest -m "not slow and not online and not solver and not gurobi and not
          memote"

      - name: Build source distribution and wheel
        run: python -m build

      - name: Verify wheel outside the checkout
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --no-deps dist/*.whl
          (
            cd "$smoke_dir"
            "$smoke_dir/venv/bin/python" -c \
              "import thg_protocol; import thg_protocol.pathway; import thg_protocol.gapfill; import thg_protocol.analysis.compare; import thg_protocol.database; import thg_protocol.model_build; import thg_protocol.merge; import thg_protocol.cell_specific; print(thg_protocol.__version__)"
            "$smoke_dir/venv/bin/thg-gapfill" --help
            "$smoke_dir/venv/bin/thg-compare" --help
            "$smoke_dir/venv/bin/thg-pathway" --help
          )

  solver:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install solver dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -c constraints/py312-glpk.txt -e ".[dev,solver]"
      - name: Run solver tests
        run: pytest -m "solver and not gurobi and not memote" || test "$?" -eq 5

  slow-online:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run slow non-solver tests
        run: >-
          pytest -m "slow and not solver and not gurobi and not memote" ||
          test "$?" -eq 5
      - name: Run online non-solver tests
        run: >-
          pytest -m "online and not slow and not solver and not gurobi and not memote" ||
          test "$?" -eq 5
