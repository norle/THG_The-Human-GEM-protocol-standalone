site_name: THG Protocol
site_description: Tools for constructing and analyzing human genome-scale metabolic models.
site_url: https://norle.github.io/THG_The-Human-GEM-protocol-standalone/
docs_dir: docs
exclude_docs: |
  plans/**
  internal/**
  history/**
  workflow-overview.md
  usage.md
  protocol/**
  parity/**
  legacy-api-inventory.md
  legacy-workflows.md
  service-boundary-audit.md
  api-contracts.md
  workflows/annotation.md
  workflows/cell-specific.md
  workflows/comparison.md
  workflows/database.md
  workflows/figures.md
  workflows/gapfill.md
  workflows/memote.md
  workflows/merge.md
  workflows/model-build.md
  workflows/network-analysis.md
  workflows/pathway.md
  workflows/phase0-foundations.md
  workflows/resumable-run.md
  api/index.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: fontawesome/solid/sun
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: fontawesome/solid/moon
        name: Use light mode
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - assets/mermaid-init.js
repo_url: https://github.com/norle/THG_The-Human-GEM-protocol-standalone
repo_name: norle/THG_The-Human-GEM-protocol-standalone
edit_uri: edit/refactoring-cleanup/docs/
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            inherited_members: false
            filters:
              - "!^_"
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Workflow overview: workflows/index.md
  - THG workflows:
      - THGβ1 — Curate a reference GEM: workflows/beta1.md
      - THGβ2 — Expand by GPR and location: workflows/beta2.md
      - Human Database: workflows/human-database.md
      - Final THG — Merge and validate: workflows/final-thg.md
      - Validation: workflows/validation.md
      - Reproducible and resumable runs: workflows/runs.md
  - Tools:
      - Model construction and enrichment: tools/model-construction.md
      - Annotation and GPRs: tools/annotation.md
      - Pathways and gap filling: tools/pathways-gapfill.md
      - Model comparison and analysis: tools/analysis.md
      - Cell-specific models: tools/cell-specific.md
  - Reference:
      - Inputs, outputs, and configuration: reference/io-and-config.md
      - CLI: reference/cli.md
      - Python API:
          - Core and I/O: api/core.md
          - Construction: api/construction.md
          - Annotation and GPR: api/annotation.md
          - Workflows: api/workflows.md
          - Analysis: api/analysis.md
          - Services: api/services.md
  - Contributing:
      - Development and releases: contributing/development.md
      - Architecture: contributing/architecture.md
      - Repository and data management: contributing/repository.md
  - About THG: about/history.md
